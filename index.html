<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte de voyages</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voyages">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#efe8dc;--card:#faf6ef;--ink:#1d1611;--sub:#8a7d6e;--line:#d9cdbb;--acc:#c45a38;--land:#e4d9c8;--stroke:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110d;--card:#241b15;--ink:#f5ece0;--sub:#a89888;--line:#3a2e25;--acc:#e0714b;--land:#3a2f27;--stroke:#241b15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110d;--card:#241b15;--ink:#f5ece0;--sub:#a89888;--line:#3a2e25;--acc:#e0714b;--land:#3a2f27;--stroke:#241b15;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,sans-serif;padding:18px 14px 60px;max-width:560px;margin:0 auto}
h1,h2,.big{font-family:Fraunces,Georgia,serif;font-weight:900;margin:0}
h1{font-size:30px;letter-spacing:-.5px}
.sub{color:var(--sub);font-size:13px;margin:4px 0 14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:56px;line-height:1;color:var(--ink)}
.lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub);font-weight:600;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stats .card{margin:0;padding:12px}
.stats b{font-family:Fraunces,Georgia,serif;font-size:28px;display:block}
.bar{height:8px;background:var(--land);border-radius:4px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;margin-top:6px}
#map{width:100%;aspect-ratio:2/1.05;margin-top:8px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--land);border:1px solid var(--line)}
.legend .v:before{background:var(--acc);border-color:var(--acc)}
.res button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;font:inherit;color:var(--ink)}
.trip{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.trip:last-child{border:0}
.trip small{display:block;color:var(--sub);font-style:italic;font-size:12px;margin-top:2px}
.trip .r{text-align:right;color:var(--sub);font-size:13px}
.trip button{background:none;border:0;color:var(--acc);font-size:12px;padding:4px 0 0}
.chart{display:flex;align-items:flex-end;justify-content:space-around;height:140px;gap:6px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--sub)}
.chart i{display:block;width:70%;background:var(--acc);border-radius:4px 4px 0 0;margin:3px 0}
.chart b{color:var(--ink);font-size:12px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.btn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px;font:600 16px Inter,sans-serif;margin-top:12px}
.btn.g{background:none;color:var(--sub);margin-top:4px}
.empty{color:var(--sub);font-size:13px;padding:6px 0}
</style>
</head>
<body>
<h1>Mon carnet de voyages</h1>
<p class="sub">Touche un pays pour y ajouter un voyage.</p>

<div class="card">
  <div class="big"><span id="pct">0</span> %</div>
  <div class="lbl">du monde visité</div>
  <div class="bar"><i id="barfill" style="width:0"></i></div>
</div>
<div class="stats">
  <div class="card"><b id="nc">0</b><div class="lbl">pays visités</div></div>
  <div class="card"><b id="ncity">0</b><div class="lbl">villes</div></div>
  <div class="card"><b id="nt">0</b><div class="lbl">voyages</div></div>
</div>

<div class="card">
  <b style="font-size:13px">Chercher un pays</b>
  <input id="q" placeholder="ex. Vietnam, Japon, Espagne…" autocomplete="off">
  <div class="res" id="res"></div>
  <div id="map"></div>
  <div class="legend"><span>Pas visité</span><span class="v">Visité</span></div>
</div>

<h2 style="font-size:20px;margin:18px 2px 8px">Voyages enregistrés</h2>
<div class="card" id="list"></div>

<h2 style="font-size:20px;margin:18px 2px 8px">Voyages par an</h2>
<div class="card"><div class="chart" id="chart"></div></div>

<div id="sheet"><div class="in">
  <h2 id="sname" style="font-size:24px"></h2>
  <input id="syear" type="number" inputmode="numeric" placeholder="Année (ex. 2024)">
  <input id="scities" placeholder="Villes (ex. Paris, Lyon)">
  <input id="snote" placeholder="Note (facultatif)">
  <button class="btn" id="save">Enregistrer le voyage</button>
  <button class="btn g" id="cancel">Annuler</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<script>
var TOTAL = 195, KEY = "carte-voyages-v1";
var trips = [], countries = {}, cur = null;
try { trips = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { trips = []; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(trips)); } catch (e) {} }
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

var ISO2 = "AFG:AF,ALB:AL,DZA:DZ,AND:AD,AGO:AO,ATG:AG,ARG:AR,ARM:AM,AUS:AU,AUT:AT,AZE:AZ,BHS:BS,BHR:BH,BGD:BD,BRB:BB,BLR:BY,BEL:BE,BLZ:BZ,BEN:BJ,BTN:BT,BOL:BO,BIH:BA,BWA:BW,BRA:BR,BRN:BN,BGR:BG,BFA:BF,BDI:BI,KHM:KH,CMR:CM,CAN:CA,CPV:CV,CAF:CF,TCD:TD,CHL:CL,CHN:CN,COL:CO,COM:KM,COG:CG,COD:CD,CRI:CR,CIV:CI,HRV:HR,CUB:CU,CYP:CY,CZE:CZ,DNK:DK,DJI:DJ,DMA:DM,DOM:DO,ECU:EC,EGY:EG,SLV:SV,GNQ:GQ,ERI:ER,EST:EE,ETH:ET,FJI:FJ,FIN:FI,FRA:FR,GAB:GA,GMB:GM,GEO:GE,DEU:DE,GHA:GH,GRC:GR,GRD:GD,GTM:GT,GIN:GN,GNB:GW,GUY:GY,HTI:HT,HND:HN,HUN:HU,ISL:IS,IND:IN,IDN:ID,IRN:IR,IRQ:IQ,IRL:IE,ISR:IL,ITA:IT,JAM:JM,JPN:JP,JOR:JO,KAZ:KZ,KEN:KE,KIR:KI,PRK:KP,KOR:KR,KWT:KW,KGZ:KG,LAO:LA,LVA:LV,LBN:LB,LSO:LS,LBR:LR,LBY:LY,LIE:LI,LTU:LT,LUX:LU,MKD:MK,MDG:MG,MWI:MW,MYS:MY,MDV:MV,MLI:ML,MLT:MT,MHL:MH,MRT:MR,MUS:MU,MEX:MX,FSM:FM,MDA:MD,MCO:MC,MNG:MN,MNE:ME,MAR:MA,MOZ:MZ,MMR:MM,NAM:NA,NRU:NR,NPL:NP,NLD:NL,NZL:NZ,NIC:NI,NER:NE,NGA:NG,NOR:NO,OMN:OM,PAK:PK,PLW:PW,PAN:PA,PNG:PG,PRY:PY,PER:PE,PHL:PH,POL:PL,PRT:PT,QAT:QA,ROU:RO,RUS:RU,RWA:RW,KNA:KN,LCA:LC,VCT:VC,WSM:WS,SMR:SM,STP:ST,SAU:SA,SEN:SN,SRB:RS,SYC:SC,SLE:SL,SGP:SG,SVK:SK,SVN:SI,SLB:SB,SOM:SO,ZAF:ZA,SSD:SS,ESP:ES,LKA:LK,SDN:SD,SUR:SR,SWZ:SZ,SWE:SE,CHE:CH,SYR:SY,TWN:TW,TJK:TJ,TZA:TZ,THA:TH,TLS:TL,TGO:TG,TON:TO,TTO:TT,TUN:TN,TUR:TR,TKM:TM,TUV:TV,UGA:UG,UKR:UA,ARE:AE,GBR:GB,USA:US,URY:UY,UZB:UZ,VUT:VU,VAT:VA,VEN:VE,VNM:VN,YEM:YE,ZMB:ZM,ZWE:ZW,PSE:PS,KOS:XK,GRL:GL,ATF:TF,ESH:EH,NCL:NC,PRI:PR,FLK:FK,GUF:GF,HKG:HK,MAC:MO,ABW:AW,BMU:BM,CYM:KY,GIB:GI,GLP:GP,MTQ:MQ,REU:RE,PYF:PF,ALA:AX,FRO:FO,SJM:SJ";
var I2 = {};
ISO2.split(",").forEach(function (p) { var a = p.split(":"); I2[a[0]] = a[1]; });
var dn = null;
try { dn = new Intl.DisplayNames(["fr"], { type: "region" }); } catch (e) {}
function fr(id, en) {
  try { if (dn && I2[id]) { var n = dn.of(I2[id]); if (n && n !== I2[id]) return n; } } catch (e) {}
  return en;
}
function nm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

var map = new Datamap({
  element: document.getElementById("map"),
  responsive: true,
  fills: { defaultFill: css("--land") || "#e4d9c8" },
  geographyConfig: {
    popupOnHover: false, highlightOnHover: false,
    borderColor: css("--stroke") || "#fff", borderWidth: 0.5
  }
});
map.svg.selectAll(".datamaps-subunit").each(function (g) { countries[g.id] = fr(g.id, g.properties.name); })
  .on("click", function (g) { openSheet(g.id, countries[g.id]); });
window.addEventListener("resize", function () { map.resize(); });

function paint() {
  var land = css("--land") || "#e4d9c8", acc = css("--acc") || "#c45a38", upd = {};
  Object.keys(countries).forEach(function (id) { upd[id] = land; });
  trips.forEach(function (t) { upd[t.iso] = acc; });
  map.updateChoropleth(upd);
}

function render() {
  var isos = {}, cities = {}, years = {};
  trips.forEach(function (t) {
    isos[t.iso] = 1;
    (t.cities || "").split(",").forEach(function (c) { c = c.trim(); if (c) cities[c.toLowerCase()] = 1; });
    years[t.year] = (years[t.year] || 0) + 1;
  });
  var n = Object.keys(isos).length, p = Math.round(n / TOTAL * 100);
  document.getElementById("nc").textContent = n;
  document.getElementById("ncity").textContent = Object.keys(cities).length;
  document.getElementById("nt").textContent = trips.length;
  document.getElementById("pct").textContent = p;
  document.getElementById("barfill").style.width = Math.max(p, n ? 2 : 0) + "%";

  var sorted = trips.slice().sort(function (a, b) { return a.year - b.year; });
  document.getElementById("list").innerHTML = sorted.length ? sorted.map(function (t) {
    return '<div class="trip"><div><b>' + esc(t.year) + " · " + esc(countries[t.iso] || t.country) + "</b>" +
      (t.note ? "<small>" + esc(t.note) + "</small>" : "") +
      '<button data-id="' + t.id + '">Supprimer</button></div><div class="r">' + esc(t.cities || "") + "</div></div>";
  }).join("") : '<div class="empty">Aucun voyage pour le moment. Touche un pays sur la carte.</div>';

  var ys = Object.keys(years).sort(), mx = Math.max.apply(null, ys.map(function (y) { return years[y]; }).concat([1]));
  document.getElementById("chart").innerHTML = ys.length ? ys.map(function (y) {
    return "<div><b>" + years[y] + '</b><i style="height:' + (years[y] / mx * 100) + '%"></i>' + esc(y) + "</div>";
  }).join("") : '<div class="empty" style="width:100%">Rien à afficher.</div>';
  paint();
}

function openSheet(iso, name) {
  cur = { iso: iso, name: name };
  document.getElementById("sname").textContent = name;
  document.getElementById("syear").value = new Date().getFullYear();
  document.getElementById("scities").value = "";
  document.getElementById("snote").value = "";
  document.getElementById("sheet").classList.add("on");
}
function closeSheet() { document.getElementById("sheet").classList.remove("on"); }

document.getElementById("cancel").onclick = closeSheet;
document.getElementById("sheet").onclick = function (e) { if (e.target === this) closeSheet(); };
document.getElementById("save").onclick = function () {
  var y = parseInt(document.getElementById("syear").value, 10);
  if (!cur || !y) return;
  trips.push({ id: Date.now(), iso: cur.iso, country: cur.name, year: y,
    cities: document.getElementById("scities").value.trim(), note: document.getElementById("snote").value.trim() });
  save(); closeSheet(); render();
};
document.getElementById("list").onclick = function (e) {
  var id = e.target.getAttribute("data-id");
  if (!id) return;
  trips = trips.filter(function (t) { return String(t.id) !== id; });
  save(); render();
};
document.getElementById("q").oninput = function () {
  var v = nm(this.value.trim()), out = "";
  if (v.length > 1) {
    Object.keys(countries).filter(function (id) { return nm(countries[id]).indexOf(v) > -1; })
      .slice(0, 5).forEach(function (id) { out += '<button data-i="' + id + '">' + esc(countries[id]) + "</button>"; });
  }
  document.getElementById("res").innerHTML = out;
};
document.getElementById("res").onclick = function (e) {
  var i = e.target.getAttribute("data-i");
  if (!i) return;
  document.getElementById("q").value = ""; this.innerHTML = "";
  openSheet(i, countries[i]);
};
render();
</script>
</body>
</html>
